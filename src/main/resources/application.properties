
# APLICACAO
spring.application.name=primeira-ia-java
server.port=8080

# OLLAMA LOCAL
spring.ai.model.chat=ollama
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=qwen3:1.7b

# GERACAO DE RESPOSTAS E DESEMPENHO
spring.ai.ollama.chat.temperature=0.3

# Utilizar somente a CPU
spring.ai.ollama.chat.num-gpu=0

# Desativar o modo de raciocinio
spring.ai.ollama.chat.think=false

# Manter o modelo carregado por 30 minutos
spring.ai.ollama.chat.keep_alive=30m

# LOGS DE DIAGNOSTICO
logging.level.org.springframework.ai=DEBUG

# BANCO DE DADOS MYSQL
spring.datasource.url=jdbc:mysql://localhost:3306/agente_ia_memoria
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

# DRIVER MYSQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# INICIALIZACAO DA TABELA DE MEMORIA
spring.ai.chat.memory.repository.jdbc.initialize-schema=always

# PROPAGAR ERROS DAS FERRAMENTAS
spring.ai.tools.throw-exception-on-error=true

# AULA 10 - MONITORAMENTO
management.endpoints.web.exposure.include=health,info,metrics

# INFORMACOES DA APLICACAO
management.info.env.enabled=true

info.app.name=Primeiro Agente de IA Java
info.app.description=Agente com memoria e ferramentas
info.app.version=1.0.0

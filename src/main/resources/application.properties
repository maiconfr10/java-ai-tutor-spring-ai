
# Aplicacao
spring.application.name=primeira-ia-java
server.port=8080

# Ollama local
spring.ai.model.chat=ollama
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=qwen3:1.7b

# Geracao de respostas
spring.ai.ollama.chat.temperature=0.3
spring.ai.ollama.chat.num-gpu=0
spring.ai.ollama.chat.think=false

# Logs de diagnostico (uso temporario)
logging.level.org.springframework.ai=DEBUG
